name: upload to OCI
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: today
      upload_version:
        type: string
        default: ""
      flavor_filter:
        type: string
        default: '--exclude "bare-*"'

permissions:
  contents: read

jobs:
  generate_matrix_publish:
    name: Generate flavors matrix to publish
    uses: gardenlinux/gardenlinux/.github/workflows/build_flavors_matrix.yml@ed75af27781084f5e6742bab59b89861150098d8
    with:
      flags: '${{ inputs.flavor_filter }} --no-arch --json-by-arch --build --test'
  upload_gl_artifacts:
    name: upload to OCI
    needs: [ generate_matrix_publish ]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CNAME: ''
      VERSION: ${{ inputs.version }}
      UPLOAD_VERSION: ${{ inputs.upload_version || inputs.version }}
      FLAVOR: ${{ matrix.flavor }}
      ARCH: ${{ matrix.arch }}
      REGISTRY: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix_publish.outputs.matrix) }}
      max-parallel: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2
      - run: oras version
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@efdffb9a6b279cd7aada23b02baf4ec2534dc6d2
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: 'v3.1.6'
      - name: Set flavor version reference
        run: |
          for tag in "$VERSION" "$UPLOAD_VERSION"; do
            if ! [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "Error: version and upload_version must be valid OCI tags" >&2
              exit 1
            fi
          done
          git rev-parse HEAD | cut -c1-8 | tee COMMIT
          printf '%s\n' "$VERSION" | tee VERSION
      - name: Set CNAME
        run: |
          CNAME=$(gl-features-parse --cname "$FLAVOR-$ARCH" cname)
          [[ "$CNAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]] || { echo "Error: invalid canonical image name" >&2; exit 1; }
          echo "CNAME=$CNAME" | tee -a "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.flavor }}-${{ matrix.arch }}
      - name: Push using the glcli util
        env:
          GL_CLI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_CLI_REGISTRY_USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir "$CNAME"

          tar -C "$CNAME" -xzf "$CNAME.tar.gz"

          gl-oci push-manifest \
            --dir "${CNAME}" \
            --container "$REGISTRY" \
            --arch "$ARCH" \
            --version "$VERSION" \
            --cname "${CNAME}" \
            --cosign_file digest.txt \
            --manifest_file "oci_manifest_entry_${CNAME}.json"
      - name: Add additional semver tag
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.repository_owner }}
        run: |
          : "${CNAME:?the manifest name is not set}"
          printf '%s\n' "$GH_TOKEN" | oras login -u "$REGISTRY_USERNAME" --password-stdin ghcr.io
          COMMIT_SHA_SHORT=$(git rev-parse HEAD | cut -c1-8)
          # Keep CNAME reference
          CNAME2=${CNAME//_/-}
          # Remove version from CNAME
          CNAME2=${CNAME2//-"${VERSION}"/}
          # Remove commit sha from CNAME
          CNAME2=${CNAME2//-${COMMIT_SHA_SHORT}/}
          # 8 charachter commit hash
          DASHED_VERSION=$UPLOAD_VERSION
          DASHED_VERSION=${DASHED_VERSION//./-}

          echo "Adding additional tag: ${UPLOAD_VERSION}-${CNAME2}-${DASHED_VERSION}-${COMMIT_SHA_SHORT}"
          oras tag "$REGISTRY:$VERSION-$CNAME-$ARCH" "${UPLOAD_VERSION}-${CNAME2}-${DASHED_VERSION}-${COMMIT_SHA_SHORT}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: oci_manifest_entry_${{ env.CNAME }}.json
          key: oci-manifest-${{ matrix.flavor }}-${{ matrix.arch }}-${{ github.run_id }}
      - name: Output digest to be signed
        run: |
          cat digest.txt

  upload_manifests_entries:
    needs: [ generate_matrix_publish, upload_gl_artifacts ]
    name: upload manifest entries into OCI index
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CNAME: ''
      VERSION: ${{ inputs.version }}
      UPLOAD_VERSION: ${{ inputs.upload_version || inputs.version }}
      FLAVOR: ${{ matrix.flavor }}
      ARCH: ${{ matrix.arch }}
      REGISTRY: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix_publish.outputs.matrix) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@efdffb9a6b279cd7aada23b02baf4ec2534dc6d2
      - name: Set flavor version reference
        run: |
          for tag in "$VERSION" "$UPLOAD_VERSION"; do
            if ! [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "Error: version and upload_version must be valid OCI tags" >&2
              exit 1
            fi
          done
          git rev-parse HEAD | cut -c1-8 | tee COMMIT
          printf '%s\n' "$VERSION" | tee VERSION
      - name: Set CNAME
        run: |
          CNAME=$(gl-features-parse --cname "$FLAVOR-$ARCH" cname)
          [[ "$CNAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]] || { echo "Error: invalid canonical image name" >&2; exit 1; }
          echo "CNAME=$CNAME" | tee -a "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: oci_manifest_entry_${{ env.CNAME }}.json
          key: oci-manifest-${{ matrix.flavor }}-${{ matrix.arch }}-${{ github.run_id }}
      - name: Update index using glcli tool
        env:
          GL_CLI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_CLI_REGISTRY_USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir manifests
          mv "oci_manifest_entry_${CNAME}.json" manifests/

          gl-oci push-index-from-directory \
            --index "$REGISTRY" \
            --index-tag "$UPLOAD_VERSION" \
            --manifest_folder manifests
