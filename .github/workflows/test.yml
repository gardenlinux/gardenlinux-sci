name: test hypervisor capabilities
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test (must be usi-sci)"
        type: string
        required: true
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to test (must be usi-sci)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2
        with:
          version: 1.2.2
      - name: Validate image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Error: image_tag must be a valid OCI tag"
            exit 1
          fi

          echo "Verifying image $TAG exists in GHCR..."
          if ! digest=$(oras resolve "ghcr.io/gardenlinux/gardenlinux-sci:$TAG" 2>&1); then
            echo "Error: Image tag '$TAG' not found in ghcr.io/gardenlinux/gardenlinux-sci"
            echo "Resolve output: $digest"
            exit 1
          fi
          echo "Image tag present in GHCR (digest: ${digest:0:12}...)"
      - name: Install Dependencies
        uses: ./.github/actions/test/integration/dependencies
      - name: Build
        uses: ./.github/actions/test/integration/build
        with:
          image_tag: ${{ inputs.image_tag }}
      - name: Setup
        uses: ./.github/actions/test/integration/setup
      #- name: Test QEMU
      #  uses: ./.github/actions/test/integration/test/qemu
      - name: Test CloudHypervisor
        uses: ./.github/actions/test/integration/test/cloudhypervisor
      - name: Collect Debug Logs
        if: always()
        uses: ./.github/actions/test/integration/collect-logs
