name: test hypervisor capabilities
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test (must be usi-sci); mutually exclusive with sysext_artifact"
        type: string
        required: false
      sysext_artifact:
        description: "Raws actions artifact (signed extensions, manifest, SHA256SUMS, run cert); see artifact_run_id"
        type: string
        required: false
      artifact_run_id:
        description: "Run ID in this repository that produced sysext_artifact (default: this run)"
        type: string
        required: false
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to test (must be usi-sci); mutually exclusive with sysext_artifact"
        type: string
        required: false
      sysext_artifact:
        description: "Raws actions artifact (signed extensions, manifest, SHA256SUMS, run cert); see artifact_run_id"
        type: string
        required: false
      artifact_run_id:
        description: "Run ID in this repository that produced sysext_artifact (default: this run)"
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate exactly one test input
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SYSEXT_ARTIFACT: ${{ inputs.sysext_artifact }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          if [ -n "$IMAGE_TAG" ] && [ -n "$SYSEXT_ARTIFACT" ]; then
            echo "Error: image_tag and sysext_artifact are mutually exclusive" >&2
            exit 1
          fi
          if [ -z "$IMAGE_TAG" ] && [ -z "$SYSEXT_ARTIFACT" ]; then
            echo "Error: exactly one of image_tag or sysext_artifact is required" >&2
            exit 1
          fi
          if [ -n "$ARTIFACT_RUN_ID" ] && ! [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Error: artifact_run_id must be a positive integer" >&2
            exit 1
          fi

      - name: Check out the gardenlinux submodule
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: git submodule update --init gardenlinux

      # ---- legacy image_tag branch (unchanged default) --------------------
      - name: Install oras
        if: ${{ inputs.image_tag != '' }}
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
        with:
          version: 1.2.2

      - name: Validate image tag
        if: ${{ inputs.image_tag != '' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "Error: image_tag is required"
            exit 1
          fi

          echo "Verifying image ${{ inputs.image_tag }} exists in GHCR..."
          if ! digest=$(oras resolve ghcr.io/gardenlinux/gardenlinux-sci:${{ inputs.image_tag }} 2>&1); then
            echo "Error: Image tag '${{ inputs.image_tag }}' not found in ghcr.io/gardenlinux/gardenlinux-sci"
            echo "Resolve output: $digest"
            exit 1
          fi
          echo "Image tag present in GHCR (digest: ${digest:0:12}...)"
      - name: Install Dependencies
        uses: ./.github/actions/test/integration/dependencies

      # ---- sysext branch --------------------------------------------------
      - name: Download the sysext raws artifact
        if: ${{ inputs.sysext_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sysext_artifact }}
          path: .build/ci-sysext-hv/raws
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore the run signing certificate
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: |
          if [ -f .build/ci-sysext-hv/raws/verity-run.crt ]; then
            cp .build/ci-sysext-hv/raws/verity-run.crt mkosi/verity.crt
            echo "restored the producer's run-local signing certificate"
          else
            echo "no run certificate in the raws artifact; keeping the committed certificate"
          fi
      # mkosi's sandbox builds the tools tree and the HV root image
      # unprivileged through user namespaces; the runner's AppArmor blocks
      # them by default.
      - name: Relax the runner's user-namespace restriction
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Bootstrap the toolchain
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: |
          python3 -m venv .build/mkosi/venv
          .build/mkosi/venv/bin/pip install --quiet "mkosi @ git+https://github.com/systemd/mkosi.git@v27.1"
          bash mkosi/build.sh --bootstrap

      - name: Preflight the accepted toolchain
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: bash ./.github/scripts/prepare-sysext-hv.sh --check

      - name: Rebuild the delivery image from the raws
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: |
          bash delivery/build-image.sh --from-staging .build/ci-sysext-hv/raws
          mkdir -p .build/ci-sysext-hv/artifact
          docker save sci-delivery:latest -o .build/ci-sysext-hv/artifact/sci-delivery.tar
          printf 'docker.io/library/sci-delivery:latest\n' > .build/ci-sysext-hv/artifact/sci-delivery.ref

      - name: Prepare the sysext HyperVisor base
        if: ${{ inputs.sysext_artifact != '' }}
        shell: bash
        run: |
          bash ./.github/scripts/prepare-sysext-hv.sh \
            --prepare .build/ci-sysext-hv/artifact .build/ci-sysext-hv/out
          cat .build/ci-sysext-hv/out/metadata.env >> "$GITHUB_ENV"

      - name: Build
        uses: ./.github/actions/test/integration/build
        with:
          mode: ${{ inputs.sysext_artifact != '' && 'sysext' || 'legacy' }}
          image_tag: ${{ inputs.image_tag }}
          sysext_key: ${{ env.HV_SSH_KEY }}
      - name: Setup
        uses: ./.github/actions/test/integration/setup
        with:
          mode: ${{ inputs.sysext_artifact != '' && 'sysext' || 'legacy' }}
          hv_dir: ${{ env.HV_DIR }}
      - name: Test QEMU
        uses: ./.github/actions/test/integration/test/qemu
      - name: Test CloudHypervisor
        uses: ./.github/actions/test/integration/test/cloudhypervisor
      - name: Collect Debug Logs
        if: always()
        uses: ./.github/actions/test/integration/collect-logs
