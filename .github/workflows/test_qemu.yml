name: test_qemu

on:
  workflow_call:

jobs:
  test_qemu:
    name: QEMU integration test ${{ matrix.flavor }} (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - baremetal-sci_usi
          - baremetal-sci_usidev
          - baremetal-sci_pxe
          - baremetal-capi
          - baremetal-controlplane_usi
    defaults:
      run:
        shell: bash
    env:
      CNAME: ""
    permissions:
      actions: write
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 qemu-system-arm swtpm socat libxml2-utils
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Download test distribution
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: tests/.build
          key: test-distribution-${{ github.run_id }}
      - name: Load certs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: certs
          path: cert/
      - name: Load flavor version data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: flavor-version-data
      - name: Set CNAME
        run: |
          VERSION=$(jq -r '.version' flavor_version_data.json)
          COMMIT=$(jq -r '.commit_id' flavor_version_data.json | cut -c1-8)
          echo "CNAME=${{ matrix.flavor }}-amd64-${VERSION}-${COMMIT}" | tee -a "$GITHUB_ENV"
      - name: Load flavor build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: build-${{ matrix.flavor }}-amd64
      - name: Unpack build artifacts
        run: |
          mkdir ".build"
          if [ -f "$CNAME.tar.gz" ]; then
            tar -C .build -xzf $CNAME.tar.gz
            rm "$CNAME.tar.gz"
          else
            mv $CNAME.* .build/
          fi
          tree .build
      - name: rw for KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute tests
        run: |
          if [ ! -e ".build/$CNAME.raw" ]; then
            if [ -e ".build/$CNAME.ova" ]; then
              tar xvf ".build/$CNAME.ova" -C .build
            fi
            if [ -e ".build/$CNAME.vhd" ]; then
              qemu-img convert -f vpc -O raw ".build/$CNAME.vhd" ".build/$CNAME.raw"
            elif [ -e ".build/$CNAME.qcow2" ]; then
              qemu-img convert -f qcow2 -O raw ".build/$CNAME.qcow2" ".build/$CNAME.raw"
            elif [ -e ".build/$CNAME.vmdk" ]; then
              qemu-img convert -f vmdk -O raw ".build/$CNAME.vmdk" ".build/$CNAME.raw"
            fi
          fi
          # cc.tar (USI/UKI format) contains boot.efi + root.squashfs; repack as
          # pxe.tar.gz so the gardenlinux test framework handles it as a UKI PXE boot
          if [ ! -e ".build/$CNAME.pxe.tar.gz" ] && [ -e ".build/$CNAME.cc.tar" ]; then
            gzip -c ".build/$CNAME.cc.tar" > ".build/$CNAME.pxe.tar.gz"
          fi
          if [ -e ".build/$CNAME.raw" ]; then
            ./test ".build/$CNAME.raw"
          elif [ -e ".build/$CNAME.pxe.tar.gz" ]; then
            ./test ".build/$CNAME.pxe.tar.gz"
          elif [ -e ".build/$CNAME.iso" ]; then
            ./test ".build/$CNAME.iso"
          else
            echo "no raw, pxe or iso file found, QEMU test failed"
            exit 1
          fi
      - name: Copy test results
        if: always()
        run: |
          cp tests/log/qemu.test.log .build/${CNAME}.qemu.test.log || true
          cp tests/log/qemu.test.xml .build/${CNAME}.qemu.test.xml || true
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        if: always()
        with:
          if-no-files-found: ignore
          name: qemu-test-${{ env.CNAME }}
          path: |
            .build/${{ env.CNAME }}.qemu.test.log
            .build/${{ env.CNAME }}.qemu.test.xml
