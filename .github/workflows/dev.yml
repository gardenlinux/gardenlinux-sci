name: dev
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "**/README.md"
      - "docs/**"

permissions:
  contents: read

# Cancel any in-progress PR workflow runs when PR is closed
# Used to ensure cleanup runs after any PR build are uploaded (or aborts before the upload)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'closed' }}

jobs:
  set_version:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: use VERSION file to support dev build on rel-branch
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "VERSION=today" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [set_version]
    # Do not run the privileged upstream build against fork PR code.
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
    # Required by the pinned upstream workflow, including for target: dev.
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: gardenlinux/gardenlinux/.github/workflows/build.yml@ed75af27781084f5e6742bab59b89861150098d8
    with:
      version: ${{ needs.set_version.outputs.VERSION }}
      # to set target to "release" or "nightly" we need proper KMS secrets
      # have a look at gardenlinux/.github/workflows/github.mjs
      target: dev
      fail_fast: true
    # secrets:
      # aws_region: ${{ secrets.AWS_REGION }}
      # aws_kms_role: ${{ secrets.KMS_SIGNING_IAM_ROLE }}
      # aws_oidc_session: ${{ secrets.AWS_OIDC_SESSION }}
      # secureboot_db_kms_arn: ${{ secrets.SECUREBOOT_DB_KMS_ARN }}

  build_sysext:
    name: Build sysext images
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The cache scan follows the absolute symlinks in the feature tree and
          # fails on the ones the runner cannot read.
          enable-cache: false

      # mkosi builds through unprivileged user namespaces, which the runner's
      # AppArmor profile blocks by default.
      - name: Build sysext images
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          MKOSI="mkosi @ git+https://github.com/systemd/mkosi.git@v27.1"
          test -s mkosi/mkosi.key || uv tool run --from "$MKOSI" mkosi --directory mkosi genkey
          uv tool run --from "$MKOSI" mkosi --directory mkosi build

      - name: Upload sysext artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysext-raws
          path: |
            .build/mkosi/output/*.raw
            mkosi/mkosi.crt
          retention-days: 7
          if-no-files-found: error

  meta:
    name: Compute image metadata
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    outputs:
      UPLOAD_VERSION: ${{ steps.meta.outputs.upload_version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute image metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          UPLOAD_VERSION="pr-${PR_NUMBER}"
          echo "upload_version=${UPLOAD_VERSION}" >> "$GITHUB_OUTPUT"
          IMAGE_TAG=$(.github/scripts/compute-image-tag.sh "${UPLOAD_VERSION}")
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  upload:
    name: Upload PR image to OCI
    needs: [build, meta, set_version]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/upload_oci.yml
    with:
      version: ${{ needs.set_version.outputs.VERSION }}
      upload_version: ${{ needs.meta.outputs.UPLOAD_VERSION }}
      flavor_filter: '--include-only "baremetal-sci_usi-amd64"'

  test:
    name: Test PR image
    needs: [set_version, meta, upload]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    uses: ./.github/workflows/test.yml
    with:
      image_tag: ${{ needs.meta.outputs.image_tag }}

  test_sysext:
    name: Test PR sysext
    needs: [build_sysext]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    uses: ./.github/workflows/test.yml
    with:
      sysext_artifact: sysext-raws

  cleanup_images:
    name: Cleanup PR images
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Cleanup OCI images via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          UPLOAD_VERSION="pr-${PR_NUMBER}"

          all_version_ids=""
          page=1
          page_size=100

          # Collect all matching version IDs across pages
          while true; do
            response=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/gardenlinux/packages/container/gardenlinux-sci/versions?per_page=$page_size&page=$page")

            page_ids=$(echo "$response" | jq -r --arg prefix "${UPLOAD_VERSION}" '
              .[] | select(.metadata.container.tags[]? | test("^" + $prefix + "(-.*)?$")) | .id
            ')
            if [ -n "$page_ids" ]; then
              all_version_ids="$all_version_ids $page_ids"
            fi

            page_count=$(echo "$response" | jq '. | length')
            if [ "$page_count" -lt "$page_size" ]; then
              # Stop if this was the last page
              break
            fi

            page=$((page + 1))
          done

          if [ -z "$all_version_ids" ]; then
            echo "No images found for PR ${PR_NUMBER}"
            exit 0
          fi

          for version_id in $all_version_ids; do
            echo "Deleting version $version_id"
            http_code=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/gardenlinux/packages/container/gardenlinux-sci/versions/$version_id")
            if [ "$http_code" != "204" ]; then
              echo "Failed to delete version $version_id (HTTP $http_code)"
              exit 1
            fi
          done
