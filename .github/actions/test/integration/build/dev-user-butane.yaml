variant: fcos
version: 1.3.0
passwd:
  users:
    - name: root
      password_hash: "PASSWORD_GOES_HERE"
storage:
  files:
  - path: /etc/ssh/sshd_config
    mode: 0644
    overwrite: true
    contents:
      inline: |
        PermitRootLogin yes
        AuthorizedKeysFile /etc/ssh/authorized_keys
        Protocol 2
        AuthenticationMethods publickey password
        Subsystem sftp /usr/lib/openssh/sftp-server
  # can't store in /root, is a tmpfs
  - path: /etc/ssh/authorized_keys
    mode: 0600
    contents:
      inline: "SSH_KEY_GOES_HERE"
  - path: /etc/hosts
    mode: 0644
    overwrite: true
    contents:
      inline: |
        # defaults
        127.0.0.1	localhost
        127.0.1.1	garden

        ::1     localhost ip6-localhost ip6-loopback
        ff02::1 ip6-allnodes
        ff02::2 ip6-allrouters

        # custom
        192.168.122.2 hv1
        192.168.122.3 hv2
  # turn off hugepages, not required for this test
  # also SIGNIFICANTLY reduces test runtime
  - path: /opt/persist/hugepages.env
    mode: 0755
    contents:
      inline: |
        NON_HUGEPAGES_PM=1000
  - path: /opt/persist/gl-oci.conf
    mode: 0644
    contents:
      inline: |
        # pull the image from GHCR instead of keppel
        OCI_REPO=ghcr.io/gardenlinux/gardenlinux-sci
        # point to a custom tag to download for the persist step
        OCI_TAG=TAG_GOES_HERE
  # Hook called by persist (chrooted into the new sysroot) after the UKI is
  # downloaded and before systemd-repart partitions the disk.
  # The chroot runs against the overlay-mounted sysroot: writes to /etc/ go
  # to /sysroot/var/etc.overlay/ which is copied to the VAR partition by
  # systemd-repart and applied as the /etc overlay upper layer on second boot.
  - path: /opt/persist/network_up.sh
    mode: 0755
    contents:
      inline: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        # 1. Drop a systemd-networkd config so the second boot gets DHCP on all
        #    Ethernet interfaces (virtio-net shows up as e*).
        mkdir -p /etc/systemd/network
        printf '[Match]\nName=e*\n\n[Network]\nDHCP=yes\n' \
            > /etc/systemd/network/80-dhcp.network
        echo "Wrote /etc/systemd/network/80-dhcp.network"

        # 2. Enable systemd-networkd and ssh for the second boot by creating
        #    the wants symlinks directly (systemctl may not work in chroot).
        mkdir -p /etc/systemd/system/multi-user.target.wants
        mkdir -p /etc/systemd/system/network-online.target.wants
        ln -sf /usr/lib/systemd/system/systemd-networkd.service \
            /etc/systemd/system/multi-user.target.wants/systemd-networkd.service || true
        ln -sf /usr/lib/systemd/system/systemd-networkd-wait-online.service \
            /etc/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service || true
        ln -sf /usr/lib/systemd/system/ssh.service \
            /etc/systemd/system/multi-user.target.wants/ssh.service || true

        # 3. Allow root SSH login with the authorized key on the second boot.
        #    The first-boot ignition config wrote the key to /etc/ssh/authorized_keys
        #    on the host (first-boot) system. We read it from outside the chroot
        #    via /proc/1/root (the initrd's real root) and write it into the sysroot.
        mkdir -p /etc/ssh
        printf 'PermitRootLogin yes\nAuthorizedKeysFile /etc/ssh/authorized_keys\nProtocol 2\nAuthenticationMethods publickey\nSubsystem sftp /usr/lib/openssh/sftp-server\n' \
            > /etc/ssh/sshd_config
        # /proc is bind-mounted into the chroot by the kernel; /proc/1/root is
        # the initrd root from which we can read the first-boot authorized_keys.
        if [ -f /proc/1/root/etc/ssh/authorized_keys ]; then
            cp /proc/1/root/etc/ssh/authorized_keys /etc/ssh/authorized_keys
            chmod 600 /etc/ssh/authorized_keys
            echo "Copied authorized_keys from first-boot into second-boot sysroot"
        else
            echo "WARNING: authorized_keys not found at /proc/1/root/etc/ssh/authorized_keys"
        fi

        echo "network_up.sh complete"
  # Enable unlimited core dumps for all systemd services
  - path: /etc/systemd/system.conf.d/10-core.conf
    mode: 0644
    contents:
      inline: |
        [Manager]
        DefaultLimitCORE=infinity
  # Configure systemd-coredump with reasonable limits
  - path: /etc/systemd/coredump.conf.d/50-ci-core.conf
    mode: 0644
    contents:
      inline: |
        [Coredump]
        Storage=external
        ProcessSizeMax=3G
        ExternalSizeMax=3G
        MaxUse=2G
        KeepFree=1G
        Compress=yes
  # Set kernel core pattern to use systemd-coredump
  - path: /etc/sysctl.d/50-core.conf
    mode: 0644
    contents:
      inline: |
        kernel.core_pattern=|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h
        kernel.core_pipe_limit=16
        fs.suid_dumpable=2
# Disable libvirt sockets not required for CI tests
systemd:
  units:
    - name: libvirtd-tls.socket
      mask: true
    - name: libvirtd-tcp.socket
      mask: true
    - name: ssh.service
      enabled: true
