name: build
description: Build Bootable Virtual Machine Image
inputs:
  image_tag:
    description: "Image tag to use for the build"
    required: true
  uki_path:
    description: "Optional local path to a pre-downloaded UKI file. If set, skip GHCR pull."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # TODO https://github.com/actions/cache
    - name: Set ENV
      shell: bash
      env:
        REPO: ghcr.io/gardenlinux/gardenlinux-sci
        TAG: ${{ inputs.image_tag }}
        ESP_SIZE: 2  # GiB
        DISK_SIZE: 8  # GiB
      run: |
        echo "REPO=$REPO" >> $GITHUB_ENV
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "ESP_SIZE=$ESP_SIZE" >> $GITHUB_ENV
        echo "DISK_SIZE=$DISK_SIZE" >> $GITHUB_ENV

    - name: Pull ORAS artifacts
      if: ${{ inputs.uki_path == '' }}
      shell: bash
      run: |
        # oras manifest fetch in v1.2.2 has content negotiation issues with GHCR.
        # Use curl with explicit Accept header to fetch the image manifest reliably.
        ANON_TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:gardenlinux/gardenlinux-sci:pull" | jq -r '.token')
        MANIFEST=$(curl -s \
          -H "Authorization: Bearer $ANON_TOKEN" \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          "https://ghcr.io/v2/gardenlinux/gardenlinux-sci/manifests/$TAG")
        echo "Manifest layers:"
        echo "$MANIFEST" | jq -r '.layers[] | .mediaType' | head -5
        UKI_SHA=$(echo "$MANIFEST" | jq -r '.layers[] | select(.mediaType=="application/io.gardenlinux.uki") | .digest')
        echo "UKI digest: $UKI_SHA"

        oras blob fetch "$REPO@$UKI_SHA" -o "$RUNNER_TEMP/$TAG.uki"
        UKI_SIZE=$(stat -c%s "$RUNNER_TEMP/$TAG.uki")
        echo "UKI size: $UKI_SIZE bytes"
        if [ "$UKI_SIZE" -eq 0 ]; then
          echo "::error::UKI blob is empty (digest: $UKI_SHA). The OCI artifact was built with an empty UKI — check the upstream build for version=today package issues."
          exit 1
        fi

    - name: Use local UKI artifact
      if: ${{ inputs.uki_path != '' }}
      shell: bash
      run: |
        cp "${{ inputs.uki_path }}" "$RUNNER_TEMP/$TAG.uki"
        UKI_SIZE=$(stat -c%s "$RUNNER_TEMP/$TAG.uki")
        echo "Local UKI size: $UKI_SIZE bytes"
        if [ "$UKI_SIZE" -eq 0 ]; then
          echo "::error::Local UKI file is empty: ${{ inputs.uki_path }}"
          exit 1
        fi

    - name: Generate SSH key
      shell: bash
      run: |
        ssh-keygen -t ed25519 -f "/opt/ssh_host_ed25519_key" -N "" -C "user" -q
        chmod 600 /opt/ssh_host_ed25519_key
        echo "SSH_KEY=$(cat /opt/ssh_host_ed25519_key.pub)" >> $GITHUB_ENV

    - name: Set up a raw disk image
      shell: bash
      run: |
        ESP_END="${ESP_SIZE}GiB"
        DISK_IMG="${RUNNER_TEMP}/${TAG}.img"
        echo "DISK_IMG=$DISK_IMG" >> $GITHUB_ENV

        qemu-img create "$DISK_IMG" "${DISK_SIZE}G"
        parted "$DISK_IMG" --script mklabel gpt
        parted "$DISK_IMG" --script mkpart ESP fat32 1MiB "$ESP_END"
        parted "$DISK_IMG" --script set 1 esp on
        parted "$DISK_IMG" --script mkpart var ext4 "$ESP_END" 100%

        parted "$DISK_IMG" --script name 1 ESP
        parted "$DISK_IMG" --script name 2 VAR

        LOOPDEV=$(sudo losetup --show -fP "$DISK_IMG")
        echo "LOOPDEV=$LOOPDEV" >> $GITHUB_ENV
        ESP_PART="${LOOPDEV}p1"
        echo "ESP_PART=$ESP_PART" >> $GITHUB_ENV
        VAR_PART="${LOOPDEV}p2"
        echo "VAR_PART=$VAR_PART" >> $GITHUB_ENV

        sudo mkfs.vfat -F32 "$ESP_PART"
        sudo mkfs.ext4 -L VAR "$VAR_PART"

    - name: Populate the ESP partition
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/esp"
        sudo mount "$ESP_PART" "$RUNNER_TEMP/esp"

        # Place the UKI directly as BOOTX64.EFI so OVMF loads it as an EFI binary.
        # Systemd-boot's 'linux' entry type cannot load a UKI (it expects a bzImage);
        # placing the UKI in EFI/Linux/ lets systemd-boot auto-discover it as a Type 2
        # entry, but OVMF can boot the UKI directly without a bootloader.
        sudo mkdir -p "$RUNNER_TEMP/esp/EFI/BOOT"
        sudo cp "$RUNNER_TEMP/$TAG.uki" "$RUNNER_TEMP/esp/EFI/BOOT/BOOTX64.EFI"

        sudo umount "$RUNNER_TEMP/esp"

    - name: Populate the VAR partition
      shell: bash
      run: |
        # Pre-populate the VAR partition so the UKI boots directly into the
        # production system without running the firstboot/persist flow.
        #
        # The _usi initrd mounts VAR at /sysroot/var and then overlays /etc from
        # var/etc.overlay. We pre-create the overlay dirs and write the SSH
        # authorized_keys and systemd-networkd config so the system has network
        # and SSH access on first boot.
        mkdir -p "$RUNNER_TEMP/var"
        sudo mount "$VAR_PART" "$RUNNER_TEMP/var"

        # Overlay dirs required by sysroot-etc.mount
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay"
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay.workdir"

        # Dirs required by sysroot-home.mount and sysroot-opt.mount bind mounts
        sudo mkdir -p "$RUNNER_TEMP/var/home"
        sudo mkdir -p "$RUNNER_TEMP/var/opt"

        # SSH: allow root login with the CI key.
        # We replace sshd_config in the overlay (it shadows the lowerdir copy).
        # Mirror the base sshd_config from features/ssh/file.include but flip
        # PermitRootLogin to yes and add AuthorizedKeysFile for the CI key.
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay/ssh"
        echo "$SSH_KEY" | sudo tee "$RUNNER_TEMP/var/etc.overlay/ssh/authorized_keys" > /dev/null
        sudo chmod 600 "$RUNNER_TEMP/var/etc.overlay/ssh/authorized_keys"
        printf 'PermitRootLogin yes\nX11Forwarding no\nStrictModes yes\nIgnoreRhosts yes\nHostbasedAuthentication no\nLogLevel VERBOSE\nUsePAM yes\nPrintMotd no\nAcceptEnv LANG\nSubsystem sftp /usr/lib/openssh/sftp-server -f AUTHPRIV -l INFO\nClientAliveInterval 600\nClientAliveCountMax 0\nAuthenticationMethods publickey\nAuthorizedKeysFile /etc/ssh/authorized_keys\nHostKey /etc/ssh/ssh_host_ed25519_key\nHostKey /etc/ssh/ssh_host_rsa_key\nInclude /etc/ssh/sshd_config.d/*.conf\n' | sudo tee "$RUNNER_TEMP/var/etc.overlay/ssh/sshd_config" > /dev/null

        # systemd-networkd: bring up DHCP on all Ethernet interfaces
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay/systemd/network"
        printf '[Match]\nName=e*\n\n[Network]\nDHCP=yes\n' | sudo tee "$RUNNER_TEMP/var/etc.overlay/systemd/network/80-dhcp.network" > /dev/null

        # Enable systemd-networkd, networkd-wait-online, and ssh via wants symlinks
        # (systemctl doesn't work outside the running system)
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay/systemd/system/multi-user.target.wants"
        sudo mkdir -p "$RUNNER_TEMP/var/etc.overlay/systemd/system/network-online.target.wants"
        sudo ln -sf /usr/lib/systemd/system/systemd-networkd.service \
            "$RUNNER_TEMP/var/etc.overlay/systemd/system/multi-user.target.wants/systemd-networkd.service"
        sudo ln -sf /usr/lib/systemd/system/systemd-networkd-wait-online.service \
            "$RUNNER_TEMP/var/etc.overlay/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service"
        sudo ln -sf /usr/lib/systemd/system/ssh.service \
            "$RUNNER_TEMP/var/etc.overlay/systemd/system/multi-user.target.wants/ssh.service"

        # Mask OVS services: ovsdb-server fails in CI (no persistent OVS DB)
        # and ovs-vswitchd then blocks multi-user.target for 5 minutes.
        # Masking (symlink to /dev/null) prevents them from starting.
        sudo ln -sf /dev/null "$RUNNER_TEMP/var/etc.overlay/systemd/system/ovsdb-server.service"
        sudo ln -sf /dev/null "$RUNNER_TEMP/var/etc.overlay/systemd/system/ovs-vswitchd.service"
        sudo ln -sf /dev/null "$RUNNER_TEMP/var/etc.overlay/systemd/system/openvswitch-switch.service"

        # Hosts file for HV-to-HV communication
        # Use printf to avoid literal tabs which break YAML parsing
        printf '127.0.0.1\tlocalhost\n127.0.1.1\tgarden\n::1\tlocalhost ip6-localhost ip6-loopback\nff02::1\tip6-allnodes\nff02::2\tip6-allrouters\n192.168.122.2 hv1\n192.168.122.3 hv2\n' | sudo tee "$RUNNER_TEMP/var/etc.overlay/hosts" > /dev/null

        sudo umount "$RUNNER_TEMP/var"
        sudo losetup -d "$LOOPDEV"

    - name: Convert to QCOW2
      shell: bash
      run: |
        qemu-img convert -O qcow2 "$DISK_IMG" "/opt/${TAG}.qcow2"

    - name: Download ubuntu cloud image
      shell: bash
      run: |
        wget -q "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img" -O /opt/ubuntu.qcow2

    - name: Generate raw ubuntu image for CHV
      shell: bash
      run: |
        qemu-img convert -p -f qcow2 -O raw /opt/ubuntu.qcow2 /opt/ubuntu.raw

    - name: Generate ubuntu cloud-init
      shell: bash
      run: |
        PASSWORD=$(openssl passwd "password")
        echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
        sed -i "s|SSH_KEY_GOES_HERE|$SSH_KEY|g" ./.github/actions/test/integration/build/user-data
        sed -i "s|PASSWORD_GOES_HERE|$PASSWORD|g" ./.github/actions/test/integration/build/user-data
        genisoimage -output /opt/ubuntu-cloud-init-ds.iso -volid cidata -joliet -rock ./.github/actions/test/integration/build/meta-data ./.github/actions/test/integration/build/user-data

    # - name: Upload artifacts
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: gardenlinux-sci-${{ inputs.image_tag }}
    #     path: /opt/${{ inputs.image_tag }}.*
    #     retention-days: 1
    #     overwrite: true
