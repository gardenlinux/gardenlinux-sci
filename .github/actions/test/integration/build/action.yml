name: build
description: Build Bootable Virtual Machine Image
inputs:
  image_tag:
    description: "Image tag to use for the build"
    required: true
runs:
  using: "composite"
  steps:
    # TODO https://github.com/actions/cache
    - name: Set ENV
      shell: bash
      env:
        REPO: ghcr.io/gardenlinux/gardenlinux-sci
        TAG: ${{ inputs.image_tag }}
        ESP_SIZE: 2  # GiB
        DISK_SIZE: 8  # GiB
      run: |
        echo "REPO=$REPO" >> $GITHUB_ENV
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "ESP_SIZE=$ESP_SIZE" >> $GITHUB_ENV
        echo "DISK_SIZE=$DISK_SIZE" >> $GITHUB_ENV

    - name: Pull ORAS artifacts
      shell: bash
      run: |
        LAYERS=$(oras manifest fetch "$REPO:$TAG" | jq -r '.layers[]')
        UKI_SHA=$(echo $LAYERS | jq -r 'select(.mediaType=="application/io.gardenlinux.uki") | .digest')
        TAR_SHA=$(echo "$LAYERS" | jq -r 'select(.mediaType=="application/io.gardenlinux.image.archive.format.tar")' | jq -rs 'sort_by(.size) | .[0].digest')

        oras blob fetch "$REPO@$UKI_SHA" -o "$RUNNER_TEMP/$TAG.uki"
        oras blob fetch "$REPO@$TAR_SHA" -o "$RUNNER_TEMP/$TAG.tar" # wasteful, we only systemd-boot

    - name: Extract systemd-boot
      shell: bash
      run: |
        tar -xf "$RUNNER_TEMP/$TAG.tar" --no-same-owner --strip-components=5 -C "$RUNNER_TEMP" usr/lib/systemd/boot/efi/systemd-bootx64.efi

    - name: Set up a raw disk image
      shell: bash
      run: |
        ESP_END="${ESP_SIZE}GiB"
        DISK_IMG="${RUNNER_TEMP}/${TAG}.img"
        echo "DISK_IMG=$DISK_IMG" >> $GITHUB_ENV

        qemu-img create "$DISK_IMG" "${DISK_SIZE}G"
        parted "$DISK_IMG" --script mklabel gpt
        parted "$DISK_IMG" --script mkpart ESP fat32 1MiB "$ESP_END"
        parted "$DISK_IMG" --script set 1 esp on
        parted "$DISK_IMG" --script mkpart var ext4 "$ESP_END" 100%

        parted "$DISK_IMG" --script name 1 ESP
        parted "$DISK_IMG" --script name 2 VAR

        LOOPDEV=$(sudo losetup --show -fP "$DISK_IMG")
        echo "LOOPDEV=$LOOPDEV" >> $GITHUB_ENV
        ESP_PART="${LOOPDEV}p1"
        echo "ESP_PART=$ESP_PART" >> $GITHUB_ENV
        VAR_PART="${LOOPDEV}p2"

        sudo mkfs.vfat -F32 "$ESP_PART"
        sudo mkfs.ext4 "$VAR_PART" -L VAR

    - name: Populate the ESP partition
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/esp"
        sudo mount "$ESP_PART" "$RUNNER_TEMP/esp"

        sudo mkdir -p "$RUNNER_TEMP/esp/EFI/BOOT"
        sudo cp "$RUNNER_TEMP/systemd-bootx64.efi" "$RUNNER_TEMP/esp/EFI/BOOT/BOOTX64.EFI"
        sudo cp "$RUNNER_TEMP/$TAG.uki" "$RUNNER_TEMP/esp/EFI/BOOT/gardenlinux.efi"

        sudo mkdir -p "$RUNNER_TEMP/esp/loader/entries"

        cat <<EOF | sudo tee "$RUNNER_TEMP/esp/loader/loader.conf" > /dev/null
        default      gardenlinux
        timeout      3
        console-mode max
        EOF
        cat <<EOF | sudo tee "$RUNNER_TEMP/esp/loader/entries/gardenlinux.conf" > /dev/null
        title   Garden Linux (UKI)
        linux   /EFI/BOOT/gardenlinux.efi
        options systemd.gpt_auto=0 audit=0 console=ttyS0 ignition.firstboot=1 ignition.platform.id=qemu
        EOF

        sudo umount "$RUNNER_TEMP/esp"
        sudo losetup -d "$LOOPDEV"

    - name: Convert to QCOW2
      shell: bash
      run: |
        qemu-img convert -O qcow2 "$DISK_IMG" "/opt/${TAG}.qcow2"

    - name: Build the guest and the shared test SSH key
      uses: ./.github/actions/test/integration/guest
    - name: Generate ignition
      shell: bash
      run: |
        cp ./.github/actions/test/integration/build/dev-user-butane.yaml ./.github/actions/test/integration/build/dev-user-butane-hv1.yaml
        yq '.storage.files += load("./.github/actions/test/integration/build/root-hints.yaml")' ./.github/actions/test/integration/build/dev-user-butane.yaml > ./.github/actions/test/integration/build/dev-user-butane-hv2.yaml

        sed -i "s|SSH_KEY_GOES_HERE|$SSH_KEY|g" ./.github/actions/test/integration/build/dev-user-butane-hv1.yaml
        sed -i "s|SSH_KEY_GOES_HERE|$SSH_KEY|g" ./.github/actions/test/integration/build/dev-user-butane-hv2.yaml

        sed -i "s|PASSWORD_GOES_HERE|$PASSWORD|g" ./.github/actions/test/integration/build/dev-user-butane-hv1.yaml
        sed -i "s|PASSWORD_GOES_HERE|$PASSWORD|g" ./.github/actions/test/integration/build/dev-user-butane-hv2.yaml
        sed -i "s|TAG_GOES_HERE|${{ inputs.image_tag }}|g" ./.github/actions/test/integration/build/dev-user-butane-hv1.yaml
        sed -i "s|TAG_GOES_HERE|${{ inputs.image_tag }}|g" ./.github/actions/test/integration/build/dev-user-butane-hv2.yaml

        butane --pretty --strict ./.github/actions/test/integration/build/dev-user-butane-hv1.yaml > "/opt/${TAG}-hv1.ign"
        butane --pretty --strict ./.github/actions/test/integration/build/dev-user-butane-hv2.yaml > "/opt/${TAG}-hv2.ign"

    - name: Prepare the HyperVisor directory
      shell: bash
      run: |
        set -Eeuo pipefail
        HV_DIR=/opt/hv
        KEY=/opt/ssh_host_ed25519_key
        [ -s "$KEY" ] || { echo "the shared test SSH key is missing: $KEY" >&2; exit 1; }

        install -d "$HV_DIR" "$HV_DIR/disks"
        sudo install -m 0644 "/opt/${TAG}.qcow2" /var/lib/libvirt/images/HV1.qcow2
        sudo install -m 0644 "/opt/${TAG}.qcow2" /var/lib/libvirt/images/HV2.qcow2
        sudo install -m 0644 "/opt/${TAG}-hv1.ign" /var/lib/libvirt/images/HV1.ign
        sudo install -m 0644 "/opt/${TAG}-hv2.ign" /var/lib/libvirt/images/HV2.ign

        render_hv() {
          local name=$1 mac=$2
          HV_NAME=$name MAC=$mac envsubst '${HV_NAME} ${MAC}' < ./.github/actions/test/integration/setup/hv.xml > "$HV_DIR/$name.xml"
        }
        render_hv HV1 52:54:00:12:34:56
        render_hv HV2 52:54:00:65:43:21

        cat > "$HV_DIR/metadata.env" <<EOF
        HV_DIR=$HV_DIR
        HV_SSH_KEY=/opt/ssh_host_ed25519_key
        EOF
        cat "$HV_DIR/metadata.env" >> "$GITHUB_ENV"

    # - name: Upload artifacts
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: gardenlinux-sci-${{ inputs.image_tag }}
    #     path: /opt/${{ inputs.image_tag }}.*
    #     retention-days: 1
    #     overwrite: true
