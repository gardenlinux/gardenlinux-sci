name: dependencies
description: Install Dependencies for Integration Test
runs:
  using: "composite"
  steps:
    - name: apt
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          parted \
          squashfs-tools \
          qemu-kvm \
          genisoimage \
          libvirt-daemon-system \
          libvirt-clients \
          virtinst \
          bridge-utils \
          virtiofsd \
          ovmf

    # Required for storing the ignition file in /var/lib/libvirt/images
    - name: Disable libvirt qemu security driver
      shell: bash
      run: |
        sudo sed -i '/^[#[:space:]]*security_driver[[:space:]]*=/d' /etc/libvirt/qemu.conf
        echo 'security_driver = "none"' | sudo tee -a /etc/libvirt/qemu.conf
        sudo systemctl restart libvirtd

    # The libvirt qemu user must reach /dev/kvm for the hypervisor VMs.
    - name: Make /dev/kvm accessible
      shell: bash
      run: |
        if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
