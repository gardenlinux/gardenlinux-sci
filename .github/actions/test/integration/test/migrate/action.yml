name: test-migrate
description: Migrate a VM between the HyperVisors and verify it stays reachable
inputs:
  vm_name:
    description: "libvirt domain name of the VM, e.g. VM-QEMU"
    required: true
  connection:
    description: "libvirt connection arguments, e.g. '-c ch:///session'; empty for the system connection"
    required: false
    default: ""
  definition:
    description: "Runner path to the VM's libvirt domain XML"
    required: true
  destination:
    description: "libvirt URI of the migration target, e.g. qemu+ssh://root@192.168.122.3/system"
    required: true
  guest_ip:
    description: "Static IP the migrated VM keeps on the guest network"
    required: true
  storage:
    description: "'local' stages the root disk on HV1 and migrates it with --copy-storage-all; 'shared' migrates the shared disk in place"
    required: false
    default: "shared"
runs:
  using: "composite"
  steps:
    - name: Copy VM definitions and artifacts to the HyperVisors
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        DEFINITION: ${{ inputs.definition }}
        STORAGE: ${{ inputs.storage }}
      run: |
        # Required from the job environment; the shared key is the identity
        # that the ssh config names.
        [ -s /opt/ssh_host_ed25519_key ] || { echo "the shared SSH key /opt/ssh_host_ed25519_key is missing" >&2; exit 1; }
        IP_HV1="192.168.122.2"

        scp "$DEFINITION" "$IP_HV1:/opt/$VM_NAME.xml"

        # Setup links the shared raw disk and seed at the existing
        # /var/lib/libvirt/images paths; only local storage needs a copy.
        if [ "$STORAGE" = local ]; then
          scp /opt/cirros.qcow2 "$IP_HV1:/var/lib/libvirt/images/cirros.qcow2"
        fi

    - name: Start VM on HyperVisor 1
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        CONNECTION: ${{ inputs.connection }}
      run: |
        IP_HV1="192.168.122.2"

        ssh "$IP_HV1" << EOF
          virsh ${CONNECTION} define /opt/$VM_NAME.xml
          virsh ${CONNECTION} start $VM_NAME
        EOF

    - name: Wait for VM to be ready
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        CONNECTION: ${{ inputs.connection }}
      run: |
        IP_HV1="192.168.122.2"

        ssh "$IP_HV1" << EOF
          MAX_ITER="${BOOT_MAX_ITER:-60}"
          for ((i=1; i<=MAX_ITER; i++)); do
            IP=\$(virsh ${CONNECTION} domifaddr $VM_NAME | awk '/ipv4/ {print \$4}' | cut -d'/' -f1)
            if [ -z "\$IP" ]; then
              echo "No IP address found for VM. Retrying..."
            elif (( i >= MAX_ITER - 2 )); then
              # Show SSH errors on last 3 attempts for debugging
              if ssh "\$IP" 'exit'; then
                echo "VM is up at IP: \$IP"
                ssh "\$IP" 'echo "Hello, World!" > /home/cirros/hello.txt'
                break
              fi
            elif ssh "\$IP" 'exit' 2>/dev/null; then
              echo "VM is up at IP: \$IP"
              # create a dummy file for verification later
              ssh "\$IP" 'echo "Hello, World!" > /home/cirros/hello.txt'
              break
            fi
            if (( i == MAX_ITER )); then
              echo "Timeout waiting for VM to respond to SSH."
              echo "=== DIAGNOSTICS ==="
              echo "--- virsh ${CONNECTION} domifaddr $VM_NAME ---"
              virsh ${CONNECTION} domifaddr $VM_NAME || true
              echo "--- ip addr show virbr0 ---"
              ip addr show virbr0 || true
              echo "--- ip route ---"
              ip route || true
              echo "--- arp -n ---"
              arp -n 2>/dev/null || ip neigh || true
              echo "--- ssh -v attempt ---"
              ssh -v "\$IP" 'exit' 2>&1 || true
              echo "=== END DIAGNOSTICS ==="
              exit 1
            fi
            echo "Waiting for VM to respond to SSH... (\$i/\$MAX_ITER)"
            sleep 10
          done
        EOF

    - name: Migrate the VM to HyperVisor 2
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        CONNECTION: ${{ inputs.connection }}
        DESTINATION: ${{ inputs.destination }}
        STORAGE: ${{ inputs.storage }}
      run: |
        IP_HV1="192.168.122.2"

        if [ "$STORAGE" = local ]; then
          MIGRATE_STORAGE_FLAGS="--copy-storage-all"
        else
          MIGRATE_STORAGE_FLAGS=""
        fi

        ssh "$IP_HV1" << EOF
          virsh ${CONNECTION} migrate --p2p --persistent --undefinesource --live $MIGRATE_STORAGE_FLAGS $VM_NAME $DESTINATION
          if virsh ${CONNECTION} dominfo $VM_NAME &>/dev/null; then
            echo "VM is still present on HV1 after migration!"
            exit 1
          fi
        EOF

    - name: Verify VM status on HyperVisor 2
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        CONNECTION: ${{ inputs.connection }}
        GUEST_IP: ${{ inputs.guest_ip }}
      run: |
        IP_HV2="192.168.122.3"

        ssh "$IP_HV2" << EOF
          if virsh ${CONNECTION} dominfo $VM_NAME | awk '/State:/ {print \$2}' | grep -q "running"; then
            echo "VM is running on HV2."
          else
            echo "VM is not running on HV2."
            exit 1
          fi

          # waiting for the IP to be visible to the new HyperVisor via DHCP takes WAYYYYYYY too long
          # the IP is static, so we can just use it directly
          IP="$GUEST_IP"

          MAX_ITER="${VERIFY_MAX_ITER:-15}"
          for ((i=1; i<=MAX_ITER; i++)); do
            if ssh "\$IP" 'exit' 2>/dev/null; then
              echo "VM is up at IP: \$IP"
              # verify the migration by checking the dummy file
              if ssh "\$IP" 'test -f /home/cirros/hello.txt'; then
                echo "Dummy file exists on VM, migration successful."
                break
              else
                echo "Dummy file does not exist on VM, migration failed."
              fi
            fi
            if (( i == MAX_ITER )); then
              echo "Timeout waiting for VM to respond to SSH."
              echo "=== DIAGNOSTICS ==="
              echo "--- ip addr show virbr0 ---"
              ip addr show virbr0 || true
              echo "--- ip route ---"
              ip route || true
              echo "--- ssh -v attempt ---"
              ssh -v "\$IP" 'exit' 2>&1 || true
              echo "=== END DIAGNOSTICS ==="
              exit 1
            fi
            echo "Waiting for VM to respond to SSH... (\$i/\$MAX_ITER)"
            sleep 10
          done
        EOF

    - name: Stop the migrated guest
      shell: bash
      env:
        VM_NAME: ${{ inputs.vm_name }}
        CONNECTION: ${{ inputs.connection }}
      run: |
        # A started domain owns an nvram vars file, which undefine only removes
        # with --nvram; drivers without nvram succeed on the plain call.
        ssh 192.168.122.3 "virsh ${CONNECTION} destroy $VM_NAME >/dev/null 2>&1 || true
          virsh ${CONNECTION} undefine $VM_NAME >/dev/null 2>&1 ||
            virsh ${CONNECTION} undefine --nvram $VM_NAME >/dev/null 2>&1 || true"
