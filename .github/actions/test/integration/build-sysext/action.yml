name: build-sysext
description: Prepare the sysext HyperVisor base from a downloaded raws artifact
inputs:
  sysext_artifact:
    description: "Raws actions artifact (signed extensions and the run certificate)"
    required: true
  artifact_run_id:
    description: "Run ID in this repository that produced sysext_artifact (default: this run)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # The cache scan follows the absolute symlinks in the feature tree and
        # fails on the ones the runner cannot read.
        enable-cache: false
    - name: Download the sysext raws artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.sysext_artifact }}
        path: .build/ci-sysext-hv/raws
        run-id: ${{ inputs.artifact_run_id || github.run_id }}
        github-token: ${{ github.token }}
    # mkfs.ext4 -d runs inside unshare -r so every file is owned by root, so
    # the runner must allow unprivileged user namespaces.
    - name: Allow unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Prepare the sysext HyperVisor base
      shell: bash
      run: >-
        ./.github/actions/test/integration/build-sysext/prepare-sysext-hv.py
        --raws-dir .build/ci-sysext-hv/raws
        --out-dir /opt/hv
