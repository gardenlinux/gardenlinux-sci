name: build-sysext
description: Prepare the sysext HyperVisor base from a downloaded raws artifact
inputs:
  sysext_artifact:
    description: "Raws actions artifact (signed extensions, manifest, SHA256SUMS, run cert)"
    required: true
  artifact_run_id:
    description: "Run ID in this repository that produced sysext_artifact (default: this run)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Download the sysext raws artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.sysext_artifact }}
        path: .build/ci-sysext-hv/raws
        run-id: ${{ inputs.artifact_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Restore the run signing certificate
      shell: bash
      run: |
        if [ -f .build/ci-sysext-hv/raws/verity-run.crt ]; then
          cp .build/ci-sysext-hv/raws/verity-run.crt mkosi/verity.crt
          echo "restored the producer's run-local signing certificate"
        else
          echo "no run certificate in the raws artifact; keeping the committed certificate"
        fi

    # The base tree is the only mkosi-built input the guest image needs; the
    # raws arrive as artifacts, so the consumer never bootstraps a toolchain.
    - name: Ensure the published base tree
      shell: bash
      run: bash mkosi/base-image.sh ensure
    # mkfs.ext4 -d runs inside unshare -r so every file is owned by root, so
    # the runner must allow unprivileged user namespaces.
    - name: Allow unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Prepare the sysext HyperVisor base
      shell: bash
      run: bash ./.github/actions/test/integration/build-sysext/prepare-sysext-hv.sh --prepare .build/ci-sysext-hv/raws /opt/hv
