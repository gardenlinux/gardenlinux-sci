# Shared settings for every sysext image, included by mkosi.images/*/mkosi.conf.
# BaseTrees is resolved against the including subimage directory, hence the same
# depth as the subimage's own former value.

[Build]
Environment=SYSEXT_SCOPE=system

[Output]
Format=sysext
Overlay=yes

[Content]
BaseTrees=../../../.build/mkosi/base-image/current

RemoveFiles=
    usr/lib/verity.d
    usr/lib/modules/*/vmlinuz
    usr/share/doc
    usr/share/lintian
    usr/share/man
    usr/share/locale
    usr/share/augeas
    usr/share/polkit-1
    usr/share/systemtap
    usr/share/bash-completion
