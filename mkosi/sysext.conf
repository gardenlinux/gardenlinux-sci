# Shared settings for every sysext image, included by mkosi.images/*/mkosi.conf.

[Build]
Environment=SYSEXT_SCOPE=system

[Output]
Format=sysext
Overlay=yes

[Content]
BaseTrees=%C/base-image/rootfs.tar
ExtraTrees=%C/extension-release:/usr/lib/extension-release.d/extension-release.%I
WithDocs=no

RemoveFiles=
    usr/lib/python3*/**/__pycache__
    usr/lib/verity.d
    usr/lib/modules/*/vmlinuz
    usr/share/lintian
    usr/share/locale
    usr/share/augeas
    usr/share/polkit-1
    usr/share/systemtap
    usr/share/bash-completion
