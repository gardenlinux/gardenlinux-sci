[Distribution]
Distribution=debian
Release=2150.9.0

[Build]
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=noble
CacheDirectory=../.build/mkosi/cache
SandboxTrees=../.build/mkosi/sandbox
SandboxTrees=../keyring.gpg:/usr/share/keyrings/gardenlinux.gpg

[Output]
Format=none
OutputDirectory=../.build/mkosi/output

[Validation]
# Signed sysext raws; key scope and trust model: docs/sysext-virt.md.
Verity=signed
VerityKey=../.build/keys/sysext-verity.key
VerityCertificate=../.build/keys/sysext-verity.crt
