# The sysext merge covers /usr only; recreate the OVS state dirs at boot.
d /etc/openvswitch 0755 root root -
d /var/lib/openvswitch 0755 root root -
d /var/log/openvswitch 0755 root root -
# The package postinst links /etc/openvswitch/conf.db into /var; the /etc half
# is build-tree-only state and is not shipped. L (not L+) recreates the link,
# but never replaces an existing real database file.
L /etc/openvswitch/conf.db - - - - /var/lib/openvswitch/conf.db
