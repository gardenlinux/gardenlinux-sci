# qemu driver state dirs. A sysext merges /usr only, so /var is not merged:
# the per-driver dirs the driver package carries as EMPTY build-time dirs
# (/var/lib/libvirt/qemu, /var/log/libvirt/qemu) must be created on the host,
# and sci-40-libvirt's fragment creates only the parents /var/lib/libvirt and
# /var/log/libvirt. Type d, never D: the domain disks and logs below these
# paths must survive every tmpfiles run.
d /var/lib/libvirt/qemu 0755 root root -
d /var/log/libvirt/qemu 0755 root root -
# libvirt's qemu.conf has no /usr fallback: materialize the VNC port
# policy at activation. Type C is copy-once, so operator edits survive.
d /etc/libvirt 0755 root root -
C /etc/libvirt/qemu.conf 0644 root root - /usr/share/sci/etc/libvirt/qemu.conf
