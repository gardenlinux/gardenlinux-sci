# Compute-agent state dirs (identities owned by this extension).
d /var/lib/nova 0750 nova libvirt-qemu -
d /var/lib/nova/instances 0750 nova libvirt-qemu -
d /var/lib/nova/.ssh 0600 nova libvirt-qemu -
d /var/lib/nova/mnt 0750 nova libvirt-qemu -
d /etc/pki/CA 0755 kvm-node-agent kvm-node-agent -
d /etc/pki/libvirt 0755 kvm-node-agent kvm-node-agent -
d /etc/pki/qemu 0755 kvm-node-agent kvm-node-agent -
