# Group pre-declarations (agreeing duplicates of the owning extensions'
# declarations — self-sufficiency in any composition).
g openvswitch 476
g libvirt 42437
g libvirt-qemu 64055
# Reference-only: the base image owns the kvm group with a dynamic gid.
g kvm -
# Compute-plane agent identities (chart-consumed; the NFS/UID contract).
u openstack 42424 "OpenStack" /var/lib/openstack /usr/sbin/nologin
u nova 42436 "Nova compute" /var/lib/nova /bin/bash
u kvm-node-agent 42438 "KVM node agent" /var/lib/kvm-node-agent /usr/sbin/nologin
m nova libvirt
m nova openvswitch
m kvm-node-agent libvirt
