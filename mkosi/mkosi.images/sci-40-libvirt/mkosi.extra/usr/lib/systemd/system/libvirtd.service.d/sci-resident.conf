# SCI: keep libvirtd resident.
# The stock unit sets LIBVIRTD_ARGS="--timeout 120" (idle exit after 120s).
# kvm-node-agent's health check requires libvirtd.service ActiveState=active;
# with the idle exit the service flaps inactive while the sockets still serve.
# An empty override clears the stock value (later Environment= wins).
[Service]
Environment=LIBVIRTD_ARGS=
