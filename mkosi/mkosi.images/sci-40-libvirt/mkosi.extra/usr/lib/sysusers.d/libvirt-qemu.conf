# SCI libvirt-domain identities (canonical owner of this path).
# Fixed ids per the SCI UID contract; agrees with sci-20-compute's
# pre-declarations (g libvirt 42437, g libvirt-qemu 64055).
g libvirt 42437
g libvirt-qemu 64055
# Reference-only: the base image owns the kvm group with a dynamic gid.
g kvm -
u libvirt-qemu 64055 "libvirt QEMU user" /var/lib/libvirt -
m libvirt-qemu kvm
