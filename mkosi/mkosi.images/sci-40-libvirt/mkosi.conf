[Content]
# The module list and the per-vendor install guards are shared with the base
# feature, so both stay in one place. The guards exit 0 on a foreign CPU, so
# an AMD host loads no kvm_intel and systemd-modules-load keeps its exit 0.
ExtraTrees=
    ../../../features/sci/file.include/etc/modules-load.d/kvm.conf:/usr/lib/modules-load.d/kvm.conf
    ../../../features/sci/file.include/etc/modprobe.d/kvm-amd.conf:/usr/lib/modprobe.d/kvm-amd.conf
    ../../../features/sci/file.include/etc/modprobe.d/kvm-intel.conf:/usr/lib/modprobe.d/kvm-intel.conf

Packages=
    libvirt-daemon
    libvirt-clients
    libvirt-daemon-driver-network
    libvirt-daemon-driver-storage
    libvirt-daemon-driver-secret
    libvirt-daemon-driver-nodedev
    libvirt-daemon-driver-nwfilter
    swtpm

[Include]
Include=../../sysext.conf
